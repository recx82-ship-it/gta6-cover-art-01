<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Sunset Cover Studio</h1>
    <p class="tagline">Your photo + a caption, made into GTA-style poster cover art. Photos never leave your machine.</p>

    <h2>1 · Photos</h2>
    <label>Photo A <input id="photo-0" type="file" accept="image/*"></label>
    <button id="sample-0" type="button">Use sample: Pier</button>
    <label>Photo B <input id="photo-1" type="file" accept="image/*"></label>
    <button id="sample-1" type="button">Use sample: Boulevard</button>
    <label>Photo C <input id="photo-2" type="file" accept="image/*"></label>
    <button id="sample-2" type="button">Use sample: Pier</button>

    <h2>2 · Panels</h2>
    <label>Panel
      <select id="active-panel">
        <option value="0">Panel 1 — hero</option>
        <option value="1">Panel 2</option>
        <option value="2">Panel 3</option>
      </select>
    </label>
    <label>Photo in this panel
      <select id="panel-photo">
        <option value="0">Photo A</option>
        <option value="1">Photo B</option>
        <option value="2">Photo C</option>
        <option value="-1">Sunset sky (no photo)</option>
      </select>
    </label>
    <label>Zoom <span id="zoom-value">100%</span>
      <input id="panel-zoom" type="range" min="1" max="2.5" step="0.05" value="1">
    </label>
    <label>Move left / right
      <input id="panel-pan-x" type="range" min="-1" max="1" step="0.05" value="0">
    </label>
    <label>Move up / down
      <input id="panel-pan-y" type="range" min="-1" max="1" step="0.05" value="0">
    </label>

    <h2>3 · Layout &amp; grade</h2>
    <div id="layouts" class="picker" role="group" aria-label="Layout"></div>
    <div id="grades" class="picker" role="group" aria-label="Colour grade"></div>
    <label>Grade strength <span id="strength-value">85%</span>
      <input id="strength" type="range" min="0" max="1" step="0.05" value="0.85">
    </label>

    <h2>4 · Words</h2>
    <label>Kicker <input id="kicker" type="text" maxlength="30" value="Sunset City"></label>
    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    <label>Sub-caption <input id="subcaption" type="text" maxlength="60" value="Neon nights • One last ride"></label>

    <h2>5 · Export PNG</h2>
    <div id="exports" class="exports"></div>
    <p id="status" role="status"></p>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="720" height="720" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
